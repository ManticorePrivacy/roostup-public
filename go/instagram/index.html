<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roost Up · Télécharger</title>
<link rel="stylesheet" href="../../style.css">
<script>
  // Lien des réseaux (instagram) : envoie vers le bon store, avec la source pour savoir d'où viennent les installations.
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  if (ios) location.replace("https://apps.apple.com/fr/app/id6827590943?ct=instagram&mt=8");
  else if (android) location.replace("https://play.google.com/store/apps/details?id=app.roostup&referrer=utm_source%3Dinstagram%26utm_medium%3Dsocial%26utm_campaign%3Droostupapp");
</script>
</head>
<body>
<main>
<h1>Roost Up</h1>
<p>Le réveil qu'on n'éteint qu'en se levant.</p>
<p><a href="https://play.google.com/store/apps/details?id=app.roostup&referrer=utm_source%3Dinstagram%26utm_medium%3Dsocial%26utm_campaign%3Droostupapp">Télécharger sur Google Play</a></p>
<p><a href="https://apps.apple.com/fr/app/id6827590943?ct=instagram&mt=8">Télécharger sur l'App Store</a></p>
</main>
</body>
</html>
